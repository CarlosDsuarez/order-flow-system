[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "order-flow-system"
version = "0.1.0"
description = "Análisis de order flow para futuros perpetuos de criptomonedas: captura L2/L3, reconstrucción del libro, métricas de microestructura (OFI, MLOFI, VPIN, CVD) y backtesting de market making pasivo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Carlos Suárez" }]
keywords = [
  "order-flow",
  "market-microstructure",
  "limit-order-book",
  "crypto",
  "perpetual-futures",
  "market-making",
  "backtesting",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15.0",
  "websockets>=13.0",
  "orjson>=3.9",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "sortedcontainers>=2.4",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
questdb = ["questdb>=2.0"]
analytics = ["duckdb>=1.1"]
notebooks = [
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "ipykernel>=6.29",
  "statsmodels>=0.14",
]
# nautilus_trader is optional so `uv sync` (metrics + capture) stays light.
# hftbacktest is a separate extra so nautilus can be installed without it.
# Pin verified 2026-09-02 against PyPI (latest stable 2.4.4, 2025-12-10).
backtest = [
  "nautilus_trader==1.231.0; python_full_version >= '3.12' and python_full_version < '3.15'",
]
hftbacktest = [
  "hftbacktest==2.4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pandas-stubs>=2.2",
  "sortedcontainers-stubs>=2.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_flow"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "ANN", # flake8-annotations
  "S",   # flake8-bandit
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "PT",  # flake8-pytest-style
  "TC",  # flake8-type-checking (formerly TCH)
  "PL",  # pylint
]
ignore = [
  "PLR0913", # too many arguments: event constructors / feed config legitimately take many
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is the point of a test
  "S105",    # fake credentials in config tests
  "S106",
  "PLR2004", # magic numbers are expected values
]
"scripts/**" = [
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLC0415",
]
"src/order_flow/backtest/nautilus_factory.py" = ["PLC0415", "ANN401"]
"src/order_flow/backtest/ofi_mm.py" = ["PLC0415", "ANN401", "TC002"]
"src/order_flow/backtest/runner.py" = ["PLC0415", "PLR0915", "ANN401"]
"src/order_flow/backtest/hft_runner.py" = ["PLC0415", "PLR0915", "ANN401"]
"tests/unit/test_nautilus_engine.py" = ["PLC0415"]
"tests/unit/test_nautilus_factory.py" = ["ANN401"]
"tests/unit/test_hft_engine.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["order_flow"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

# nautilus_trader ships a large mixed Cython/Rust tree; do not weaken strict on order_flow.
[[tool.mypy.overrides]]
module = ["nautilus_trader", "nautilus_trader.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["hftbacktest", "hftbacktest.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=order_flow --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
  "integration: requires network or external services (skipped unless RUN_INTEGRATION=1)",
  "nautilus: needs nautilus_trader (uv sync --extra backtest, or RUN_NAUTILUS=1)",
  "hftbacktest: needs hftbacktest (uv sync --extra hftbacktest, or RUN_HFTBACKTEST=1)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["order_flow"]
branch = true
omit = [
  "*/order_flow/backtest/ofi_mm.py",
  "*/order_flow/backtest/runner.py",
  "*/order_flow/backtest/hft_runner.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "@(abc\\.)?abstractmethod",
  "@overload",
]
